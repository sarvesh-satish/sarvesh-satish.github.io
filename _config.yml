        title: Liberty Mutual Insurance
        link: https://www.libertymutual.com
        sub_title: Software Engineering Intern — Digital Analytics
        caption: Summer 2026 – Boston, MA
        quote: >
          Re-architected an analytics-requirements assistant and expanded its reviewed knowledge base while improving the team’s engineering workflow.
        description: |
          Re-architected a Slack-based analytics-requirements chatbot from a monolithic knowledge-base prompt into a retrieval-augmented generation (RAG) system. Built a router that selects the relevant analytics implementation requirement document types while handling ambiguous requests.

          Built a human-in-the-loop Excel-to-JSON ingestion pipeline and Git-reviewable knowledge base, expanding coverage from 1 to 3 document types with 68 reviewed records from 45 real analytics flows and 23 always-on rules.

          Diagnosed more than 400 Codacy failures in a Kafka consumer as an ESLint v9 and Jest globals configuration gap. Reproduced the local/CI mismatch, isolated the CI/CD failure to an internal GitHub Actions wrapper, and drove platform and vendor escalation to a documented upstream limitation.

      - layout: left
        title: Liberty Mutual Insurance
        link: https://www.libertymutual.com
        sub_title: Software Engineering Intern — Software Testing
        caption: Summer 2025 – Indianapolis, IN
        quote: >
          Built performance-testing tools and migration automation used across more than a dozen engineering teams.
        description: |
          Extended an internal k6 accelerator by building and integrating over 5 new features, including automated test triggering through GitHub Actions. This reduced manual effort and improved load-test coverage for more than a dozen engineering teams.

          Designed and implemented a migration script that moved projects from LoadRunner Enterprise to LoadRunner Cloud, saving roughly 5 hours per project across 16 projects (over 80 total hours). This solved a vendor-declared limitation using custom scripting and pipeline automation.


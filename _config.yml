about_content: | # this will include new lines to allow paragraphs
  I’m a senior at Indiana University studying Computer Science with a minor in Business. I enjoy turning ambiguous problems into practical software, from AI-assisted analytics workflows to developer tools that reduce manual work and improve collaboration.

  Across two software engineering internships at Liberty Mutual, I’ve built retrieval-augmented generation systems, automated performance-testing workflows, and data migration tools. My projects span Next.js, TypeScript, Python, React, Node.js, and cloud-native developer tooling. Beyond engineering, leading the Standards Board for Phi Gamma Nu strengthened my ability to communicate clearly, make thoughtful decisions, and help teams succeed.

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: MyAccess 2.0 — Liberty Mutual Intern Hackathon
        quote: >
          July 2026 • 3rd Place<br>
          Tech: Next.js, TypeScript, Prisma<br>
          Team Size: 6
        description: |
          Built a full-stack access-request prototype that helps employees identify and request the right permissions while giving managers a focused view of their teams and direct reports. The project was informed by 105 survey responses: 60% of respondents waited more than a week for access, and 86% needed help identifying what to request.

          **My Contributions:**

          🔹 **Data Access & Workflows**
          - Built the data-access layer and database-backed team, membership, and access-request workflows

          🔹 **Role-Based Access Control**
          - Implemented manager-scoped views, joinable teams, and requests requiring business justification

          🔹 **Next.js Architecture**
          - Refactored dashboard and team-detail pages into server and client components backed by Prisma
          - Scoped team and member data to the current user’s owned teams and direct reports

          🔹 **Team Delivery**
          - Shipped 6 pull requests and reviewed teammates’ code as the six-intern team delivered the prototype in 2.5 days

          Note: Repository is private to Liberty Mutual.

      - layout: top-middle
        title: Hermes — Liberty Mutual Intern Hackathon
        quote: >
          July 2025 • 3rd of 25+ teams<br>
          Tech: Slack API, GitHub Webhooks, Snowflake
        description: |
          Built a merge-conflict prediction tool that analyzes Git branch activity and warns developers before cross-team collisions. The project placed 3rd out of more than 25 teams and projected more than $10,000 in annual developer-time savings.

          **My Contributions:**

          🔹 **Real-Time Workflows**
          - Integrated GitHub webhooks to trigger backend analysis as branch activity occurred

          🔹 **Conflict Prediction**
          - Analyzed branch naming patterns, commit timing, and divergence to identify likely collisions

          🔹 **Historical Data**
          - Stored branch activity in Snowflake to support conflict prediction over time

          Note: Repository is private to Liberty Mutual.

      - layout: top-middle
        title: Idea.AI — Luddy Hackathon Project (April 2025)
        additional_links:
          - title: Team Repo
            icon: fab fa-github
            url: https://github.com/Yuskur/Luddy_Hackathon_Case1
        quote: >
          Full-stack AI idea-ranking tool built with Mistral via Ollama.<br>
          Role: Full-stack developer (LLM integration, backend, ranking logic)<br>
          Tech: Node.js, Express, React, Docker, Ollama (Mistral LLM)<br>
          Team Size: 4
        description: |
          Idea.AI is a tool that helps teams evaluate and prioritize ideas using Mistral through Ollama. The app scores ideas based on customizable ROI and Effort metrics, then ranks them using a dynamic, weight-driven algorithm exposed through a clean React UI.

          **My Contributions:**

          🔹 **AI Evaluation Pipeline**
          - Integrated Ollama's Mistral model and built the custom prompt workflow
          - Implemented the algorithm that evaluates ideas based on ROI/Effort

          🔹 **Dynamic Ranking System**
          - Added adjustable weight sliders to prioritize ROI, Effort, or balance both
          - Connected real-time updates from UI -> backend -> LLM -> frontend

          🔹 **Backend & Infrastructure**
          - Built Express API routes for evaluation, ranking, and agent logic
          - Helped teammates adopt React effectively for the first time

          **Screenshots:**

          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: flex-start;">
